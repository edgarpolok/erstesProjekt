<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Lernsystem · Stil D „Klar + Heft": ruhige Karten, Serife für Überschriften, Farbe nur für Gebiete, Grün für erledigt */
:root {
  --bg: #F7F6F2; --card: #FFFFFF; --line: #E6E2DA; --ink: #23211D; --quiet: #67625A; --soft: #F0EEE9;
  --nav: #FCFBF9; --ring: #948F86; --pick: #FFFFFF; --ok: #3E8E5E; --ok-text: #2F7049; --ok-soft: #E4F1E8;
  --ok-mark: #FFFFFF; --knob-off: #FFFFFF; --x: #B4574F; --seg: #F0EDE7; --band: #E4DFD6; --soll: #BFB7A9;
  --shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  --g-blau: #4A76C9; --g-blau-t: #2F5AA8; --g-violett: #8063C9; --g-violett-t: #5E44A6;
  --g-orange: #C07A3A; --g-orange-t: #8C5420; --g-petrol: #2E8585; --g-petrol-t: #1E6464;
  --g-rosa: #B45A8C; --g-rosa-t: #8E3F6C; --g-oliv: #868436; --g-oliv-t: #63621F;
  --ok-band: #CFE6D6; --hl: #F7E8A6; --hl-text: #3B3416; --hl-dot: #C9A227; --past: #FAF9F6; --st1: #D8D1C4; --st2: #A0978A; --st3: #4A453D;
  --f-display: 'Fraunces', Georgia, serif;
  --f-body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1915; --card: #25221D; --line: #3B362E; --ink: #F2ECE0; --quiet: #ADA495; --soft: #332E27;
    --nav: #201E1A; --ring: #7D7466; --pick: #433D34; --ok: #7CC596; --ok-text: #9AD4AE; --ok-soft: #24362A;
    --ok-mark: #1B1915; --knob-off: #ADA495; --x: #E0918A; --seg: #2F2B25; --band: #3D3830; --soll: #6A6154;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    --g-blau: #8FB0EA; --g-blau-t: #B3C9F2; --g-violett: #B29DE6; --g-violett-t: #CFC0F2;
    --g-orange: #E0A673; --g-orange-t: #EFC9A4; --g-petrol: #6CC2C2; --g-petrol-t: #9CD9D9;
    --g-rosa: #E39CC3; --g-rosa-t: #F0BFD9; --g-oliv: #C6C47A; --g-oliv-t: #DCDAA6;
    --ok-band: #2F4A38; --hl: #4A4122; --hl-text: #F3E6B3; --hl-dot: #C9A227; --past: #211F1B; --st1: #6A6154; --st2: #A39886; --st3: #E6DED0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1915; --card: #25221D; --line: #3B362E; --ink: #F2ECE0; --quiet: #ADA495; --soft: #332E27;
  --nav: #201E1A; --ring: #7D7466; --pick: #433D34; --ok: #7CC596; --ok-text: #9AD4AE; --ok-soft: #24362A;
  --ok-mark: #1B1915; --knob-off: #ADA495; --x: #E0918A; --seg: #2F2B25; --band: #3D3830; --soll: #6A6154;
  --shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  --g-blau: #8FB0EA; --g-blau-t: #B3C9F2; --g-violett: #B29DE6; --g-violett-t: #CFC0F2;
  --g-orange: #E0A673; --g-orange-t: #EFC9A4; --g-petrol: #6CC2C2; --g-petrol-t: #9CD9D9;
  --g-rosa: #E39CC3; --g-rosa-t: #F0BFD9; --g-oliv: #C6C47A; --g-oliv-t: #DCDAA6;
  --ok-band: #2F4A38; --hl: #4A4122; --hl-text: #F3E6B3; --hl-dot: #C9A227; --past: #211F1B; --st1: #6A6154; --st2: #A39886; --st3: #E6DED0;
  color-scheme: dark;
}

html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, .serif { font-family: var(--f-display); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Gerüst ---------- */
.app { min-height: 100vh; display: flex; }
.side { display: none; }
.main { flex: 1 1 auto; min-width: 0; }
.wrap {
  width: 100%; max-width: 1160px; box-sizing: border-box; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px calc(104px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
.wrap.narrow { max-width: 620px; }
.wrap { overflow-wrap: anywhere; }
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background: var(--nav); border-top: 1px solid var(--line);
}
.bottom button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px;
  border: 0; background: transparent; color: var(--quiet); font-size: 12px; font-weight: 500;
}
.bottom button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.ico { width: 22px; height: 22px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.s { width: 18px; height: 18px; }
.ico.xs { width: 14px; height: 14px; }

@media (min-width: 900px) {
  .bottom { display: none; }
  .side {
    display: flex; flex-direction: column; gap: 4px; flex: 0 0 220px; box-sizing: border-box;
    position: sticky; top: 0; height: 100vh; padding: 32px 16px; background: var(--nav); border-right: 1px solid var(--line);
  }
  .side .brand { padding: 0 12px 20px; font-family: var(--f-display); font-size: 20px; font-weight: 600; }
  .side button {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px;
    background: transparent; color: var(--quiet); font-size: 15px; font-weight: 600; text-align: left;
  }
  .side button[aria-current="page"] { background: var(--soft); color: var(--ink); font-weight: 700; }
  .side .bottomlink { margin-top: auto; }
  .wrap { padding-block: 44px 96px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); gap: 26px; }
  .gear { display: none !important; }
}

/* ---------- Kopf ---------- */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 0 4px; }
.head .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.head .date { font-size: 14px; color: var(--quiet); }
.head h1 { font-size: 31px; line-height: 1.1; }
.head .line { font-size: 16px; line-height: 1.45; color: var(--quiet); }
@media (min-width: 900px) { .head h1 { font-size: 38px; } }
.iconbtn {
  flex: 0 0 auto; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: transparent;
  display: inline-flex; align-items: center; justify-content: center; color: var(--quiet);
}
.iconbtn:hover { background: var(--soft); }
.iconbtn[aria-disabled="true"] { opacity: 0.35; }

/* ---------- Abschnitte, Karten ---------- */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stack.l { gap: 20px; }
.h2 { margin: 0 4px 2px; font-size: 13px; font-weight: 600; color: var(--quiet); }
.h2row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 4px 2px; min-height: 24px; }
.h2row .h2 { margin: 0; }
.small { font-size: 13px; color: var(--quiet); line-height: 1.4; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.panel { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.panel h2 { font-size: 16px; font-weight: 600; }
.softbox { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 16px; background: var(--soft); }
.dashed { border: 1px dashed var(--ring); border-radius: 16px; }
.tag-bsp { white-space: nowrap; display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); color: var(--quiet); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: 2px; }
.sim { align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--quiet); font-size: 12px; font-weight: 700; }

/* ---------- Zeilen (Heute) ---------- */
.row { display: flex; flex-direction: column; gap: 6px; padding: 12px 6px 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.row .top { display: flex; align-items: center; gap: 12px; }
.row .body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row .title { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.row.done .title { color: var(--quiet); }
.row .meta { font-size: 13px; color: var(--quiet); }
.row .clock { font-size: 12px; font-weight: 600; color: var(--quiet); font-variant-numeric: tabular-nums; }
.gname { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--gt, var(--quiet)); }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--gm, transparent); flex: 0 0 auto; }
.dot.open { box-sizing: border-box; border: 1.5px solid var(--ring); }
.check {
  flex: 0 0 auto; width: 44px; height: 44px; margin: -9px -2px -9px -9px; padding: 0; border: 0; background: transparent;
  display: flex; align-items: center; justify-content: center;
}
.check .c {
  width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid var(--ring); background: transparent;
  display: flex; align-items: center; justify-content: center; transition: transform 160ms ease-out, background-color 160ms ease-out, border-color 160ms ease-out;
}
.check .c svg { width: 13px; height: 13px; fill: none; stroke: transparent; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.check.on .c { border-color: var(--ok); background: var(--ok); }
.check.on .c svg { stroke: var(--ok-mark); }
.check.pop .c { animation: pop 320ms ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.play { flex: 0 0 auto; width: 44px; height: 44px; margin: -9px -6px; padding: 0; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center; }
.play span { width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 1px solid var(--line); background: var(--soft); display: flex; align-items: center; justify-content: center; }
.play svg { width: 11px; height: 11px; fill: var(--ink); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.running { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ok-text); }
.running::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--ok); }
.timechip { flex: 0 0 auto; min-height: 44px; margin: -9px -4px; padding: 0 4px; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; }
.timechip span { padding: 4px 10px; border-radius: 12px; background: var(--soft); color: var(--quiet); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.timechip.has span { color: var(--ink); }
.dots { flex: 0 0 auto; width: 44px; height: 44px; margin: -9px -4px; padding: 0; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center; }
.dots svg { width: 18px; height: 18px; fill: var(--quiet); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 0 28px; }
.chipbtn {
  min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 22px; background: var(--soft); color: var(--ink);
  font-size: 14px; font-weight: 600; white-space: nowrap;
}
.inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 8px 0 36px; }
.inline label { font-size: 13px; font-weight: 600; color: var(--quiet); }
.inp {
  min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); font-size: 16px; min-width: 0;
}
.inp.grow { flex: 1 1 160px; }
.inp.t { width: 90px; font-variant-numeric: tabular-nums; }
select.inp { padding: 0 8px; }
.btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 700; }
.btn.big { min-height: 52px; border-radius: 14px; font-size: 16px; }
.btn.ghost { background: transparent; color: var(--quiet); font-weight: 600; }
.btn.line { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.linkbtn { min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: underline; align-self: flex-start; }
.switch { align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 0; border: 0; background: transparent; color: var(--quiet); font-size: 14px; font-weight: 600; }
.switch .tr { width: 40px; height: 24px; box-sizing: border-box; border-radius: 12px; background: var(--ring); position: relative; transition: background-color 160ms ease-out; flex: 0 0 auto; }
.switch .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 10px; background: var(--knob-off); transition: left 160ms ease-out; }
.switch[aria-checked="true"] .tr { background: var(--ok); }
.switch[aria-checked="true"] .tr::after { left: 18px; background: var(--ok-mark); }
.switch.ink { color: var(--ink); }
.row .switch { margin: -6px 0 -8px 36px; }
.seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 12px; background: var(--soft); }
.seg3 button { min-height: 44px; padding: 0 6px; border-radius: 9px; border: 0; background: transparent; color: var(--quiet); font-size: 14px; font-weight: 600; }
.seg3 button[aria-pressed="true"] { background: var(--pick); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.ratebox { display: flex; flex-direction: column; gap: 6px; margin: 2px 8px 2px 36px; }
.ratebox > span { font-size: 13px; font-weight: 600; color: var(--quiet); }

.cancelled { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 4px 16px; border: 1px dashed var(--ring); border-radius: 16px; font-size: 14px; color: var(--quiet); }
.cancelled s { text-decoration: line-through; }
.quietbtn { flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; }

/* Wiederholungsblock */
.wdh .headbtn { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 4px 12px 14px; border: 0; border-radius: 16px; background: transparent; text-align: left; }
.wdh .wico { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 13px; background: var(--soft); display: flex; align-items: center; justify-content: center; }
.wdh .wico.ok { background: var(--ok); color: var(--ok-mark); }
.wdh .item { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.wdh .mini { flex: 0 0 auto; width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid var(--ring); display: flex; align-items: center; justify-content: center; }
.wdh .mini svg { width: 10px; height: 10px; fill: none; stroke: transparent; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.wdh .mini.on { border-color: var(--ok); background: var(--ok); }
.wdh .mini.on svg { stroke: var(--ok-mark); }
.wdh .foot { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-top: 1px solid var(--line); }

.addrow { display: flex; gap: 8px; }
.addbtn { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border: 1.5px dashed var(--ring); border-radius: 16px; background: transparent; font-size: 15px; font-weight: 600; }
.addbtn.sq { flex: 0 0 52px; padding: 0; }
.form { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.form > label, .flabel { font-size: 13px; font-weight: 600; color: var(--quiet); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.gchip { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 22px; background: transparent; font-size: 14px; font-weight: 600; }
.gchip[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
.sel { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; white-space: nowrap; }
.sel[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.formbtns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
@media (min-width: 900px) { .kalaside .formbtns [data-a=kDel] { order: 3; flex-basis: 100%; margin-right: 0 !important; justify-content: flex-start; text-align: left; padding-left: 4px; } }
@media (max-width: 480px) { .formbtns .btn { padding-left: 12px; padding-right: 12px; } .formbtns .btn.ghost { padding-left: 6px; padding-right: 6px; } }
.more { align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 44px; margin: -6px 0; padding: 0; border: 0; background: transparent; color: var(--quiet); font-size: 14px; font-weight: 600; }

.pool { display: flex; flex-direction: column; background: var(--soft); border-radius: 16px; }
.pool > button { width: 100%; display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; border: 0; border-radius: 16px; background: transparent; font-size: 15px; font-weight: 600; text-align: left; }
.pitem { display: flex; align-items: center; gap: 10px; padding: 10px 6px 10px 12px; background: var(--card); border-radius: 12px; }
.pitem .body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pitem .t { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.pull { flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 22px; background: transparent; font-size: 14px; font-weight: 600; }

.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rtile { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
.rtile.skip { opacity: 0.6; }
.rtile .main-b { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 58px; padding: 0 0 0 14px; border: 0; border-radius: 16px; background: transparent; font-size: 16px; font-weight: 600; text-align: left; }
.rtile .main-b .rn { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.rtile .main-b .rn .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rtile .main-b .rn .tag-bsp { margin-left: 0; }
.rtile.done .main-b, .rtile.skip .main-b { color: var(--quiet); }
.rtile .ck { flex: 0 0 auto; width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; border: 2px solid var(--ring); display: flex; align-items: center; justify-content: center; transition: background-color 160ms ease-out; }

/* ---------- Woche ---------- */

    if (i < 0) F.forEach((f, k) => { if (mins[k] > 0 && (i < 0 || f <= F[i])) i = k; }); // bei Gleichstand späte Tage zuerst leeren
    if (i < 0) break;

    if (i < 0) break;

    if (b.tag) items.push({ day: b.tag, done: done, extra: !!b.zusaetzlich, k: 'b', id: id });

  const total = items.length;

  return { total: total, done: doneN, soll: sollN, doneSoll: doneSoll, vortag: vortag, heuteOffen: heuteOffen, full: total > 0 && doneN === total, ahead: doneSoll === sollN && doneN > doneSoll && !(total > 0 && doneN === total) }; // Vorsprung nur, wenn alles bis heute Geplante erledigt ist
}

/* ---------- Vorhaben und Planung ---------- */
function vorhabenFor(T) {
  return Object.keys(D.vorhaben).filter((id) => {
    const v = D.vorhaben[id];
    if (!isDate(v.ab)) return false;
    const k = Math.round(dayDiff(T, v.ab) / 7);
    const n = Math.max(1, Math.round(num(v.wochen, 1)));
    return dayDiff(T, v.ab) % 7 === 0 && k >= 0 && k < n && !(Array.isArray(v.ohne) && v.ohne.indexOf(T) >= 0);
  }).map((id) => Object.assign({ id: id }, D.vorhaben[id]))
    .sort((a, b) => num(a.reihenfolge, 999) - num(b.reihenfolge, 999) || num(a.erstellt, 0) - num(b.erstellt, 0));
}
const vStd = (v) => (typeof v.std === 'number' && v.std > 0 ? v.std : EST_H);
// Platz pro Arbeitstag: freie Zeit minus Wiederholung; Puffer und freie Tage zählen nicht
// Blöcke, die beim erneuten Planen stehen bleiben (erledigt, heute begonnen, frei hinzugefügt, mitgenommen)
function keptBlocks(d) {
  const t = today();
  return blocksAt(d).filter((b) => !(b.status === 'offen' && (b.quelle === 'liste' || b.quelle === 'claude') && !b.mitgenommen && !b.restVon && b.tag !== t));
}
const blockH = (b) => (typeof b.std === 'number' && b.std > 0 ? b.std : (b.zeit ? num(b.zeit, 0) / 60 : 0));
// Erste Woche nach einer freien Pause (mind. 3 Tage in der Vorwoche) plant Claude bewusst leichter
const nachPause = (T) => weekDates(addDays(T, -7)).filter((d) => pauseAt(d).frei).length >= 3;
function capacity(T, split, from, withBlocks) {
  const out = {};
  const f = nachPause(T) ? 0.75 : 1;
  weekDates(T).forEach((d) => {
    if (d < from || isPufferDay(d) || isFreeDay(d) || pauseAt(d).frei) return;
    let c = (freeH(d) - num(split[d], 0) / 60) * f;
    if (withBlocks) c -= keptBlocks(d).reduce((a, b) => a + blockH(b), 0);
    if (c >= 1) out[d] = Math.round(c * 4) / 4;

  return out;
}
function planFrom(T) { const t = today(); return T > t ? T : t; }
// Verteilung nach den Neigungen (Variante C), wenn Claude nicht erreichbar ist
// Ohne gewählten Modus: ab ½ Tag am Stück (Tiefe beim Einarbeiten), kleinere Vorhaben als kurze Stücke nebenher
const modusOf = (r) => r.modus || (r.hours >= 3 ? 'stueck' : 'verteilt');
function allocRegel(rows, cap) {
  const maxB = Math.max(1, cfg().bloeckeProTag);
  const dates = Object.keys(cap).sort();
  // Große Vorhaben zuerst (Tage am Stück), wenn alles in die Woche passt oder nächste Woche eine Pause liegt; sonst gilt die Reihenfolge, damit das Unterste übrig bleibt
  const passt = rows.reduce((a, r) => a + r.hours, 0) <= dates.reduce((a, d) => a + cap[d], 0) - 0.5;
  const pauseNext = dates.length && weekDates(addDays(mondayOf(dates[0]), 7)).filter((d) => pauseAt(d).frei).length >= 3;
  if (passt || pauseNext) {
    rows = rows.map((r, i) => ({ r: r, i: i })).sort((a, b) => (modusOf(a.r) === 'stueck' ? 0 : 1) - (modusOf(b.r) === 'stueck' ? 0 : 1) || a.i - b.i).map((x) => x.r);
  }
  const left = {}; dates.forEach((d) => { left[d] = cap[d]; });
  const days = {}; dates.forEach((d) => { days[d] = []; });
  const over = [];
  const base = {}; dates.forEach((d) => { base[d] = keptBlocks(d).length; });
  const full = (d, id) => days[d].length + base[d] >= maxB && !days[d].some((x) => x.id === id);
  // Platz für das kurze Aufgreifen eines großen Vorhabens am Ende der Woche freihalten
  const lastDay = dates[dates.length - 1];
  const hasBig = rows.some((r) => modusOf(r) === 'stueck' && r.hours >= 6);
  const reserve = hasBig && lastDay && dates.length > 1 && left[lastDay] >= 1.5 && base[lastDay] + 1 < maxB;
  if (reserve) { left[lastDay] -= 0.5; base[lastDay] += 1; }
  const placed = [];
  rows.forEach((r) => {
    let h = r.hours;
    let last = null;
    if (modusOf(r) === 'verteilt') {
      let guard = 0;
      while (h > 0.01 && guard++ < 40) {
        let moved = false;
        dates.slice().sort((a, b) => left[b] - left[a] || (a < b ? -1 : 1)).forEach((d) => {
          if (h <= 0.01 || left[d] < 1 || full(d, r.id)) return;
          const take = Math.min(1.5, left[d], h);
          left[d] -= take; h -= take; moved = true;
          const ex = days[d].find((x) => x.id === r.id);
          if (ex) ex.std += take; else days[d].push({ id: r.id, titel: r.titel, std: take });
          last = d;
        });
        if (!moved) break;
      }
    } else {
      dates.forEach((d) => {
        if (h <= 0.01 || left[d] < 1 || full(d, r.id)) return;
        const take = Math.min(left[d], h);
        left[d] -= take; h -= take;
        days[d].push({ id: r.id, titel: r.titel, std: take });
        last = d;
      });
    }
    if (h > 0.01) { // Rest passte nicht

  });
  // Große Vorhaben gegen Ende der Woche kurz aufgreifen (erster verteilter Abruf)
  if (reserve) { left[lastDay] += 0.5; base[lastDay] -= 1; }
  const big = placed.filter((p) => modusOf(p.r) === 'stueck' && p.r.hours >= 6 && p.last && p.last < lastDay).sort((a, b) => b.r.hours - a.r.hours)[0];
  if (big && lastDay && left[lastDay] >= 0.5 && days[lastDay].length + base[lastDay] < maxB) {
    days[lastDay].push({ id: big.r.id, titel: shortName(big.r.titel) + ' kurz aufgreifen', std: 0.5, aufgreifen: true });

}
function checkClaudeAlloc(res, rows, cap) {
  if (!res || !Array.isArray(res.bloecke)) return null;
  const maxB = Math.max(1, cfg().bloeckeProTag);
  const byId = {}; rows.forEach((r) => { byId[r.id] = r; });
  const days = {}; Object.keys(cap).forEach((d) => { days[d] = []; });
  const used = {}; const per = {};
  for (const b of res.bloecke) {
    if (!b || !days[b.datum] || !byId[b.vorhaben]) return null;
    const std = Number(b.stunden);
    if (!(std > 0) || std > 12) return null;
    used[b.datum] = (used[b.datum] || 0) + std;
    per[b.vorhaben] = (per[b.vorhaben] || 0) + std;
    days[b.datum].push({ id: b.vorhaben, titel: String(b.titel || byId[b.vorhaben].titel).slice(0, 120), std: std });
  }
  for (const d of Object.keys(days)) { if ((used[d] || 0) > cap[d] + 0.5 || days[d].length + keptBlocks(d).length > maxB) return null; }
  for (const id of Object.keys(per)) { if (per[id] > byId[id].hours + 1) return null; }
  const over = rows.filter((r) => (per[r.id] || 0) < r.hours - 0.25).map((r) => (per[r.id] ? Object.assign({}, r, { hours: r.hours - per[r.id], rest: true }) : r));
  return { days: days, over: over, hinweis: typeof res.hinweis === 'string' ? res.hinweis.slice(0, 300) : '' };
}

/* ---------- Liegengebliebenes ---------- */
function carryOf(W) {
  return Object.keys(D.bloecke).filter((id) => { const b = D.bloecke[id]; return b.status === 'offen' && isDate(b.woche) && b.woche < W; })
    .map((id) => Object.assign({ id: id }, D.bloecke[id]))
    .sort((a, b) => (a.woche < b.woche ? -1 : a.woche > b.woche ? 1 : num(a.erstellt, 0) - num(b.erstellt, 0)));
}

/* ================= Aktionen: alles, was Daten schreibt ================= */
let ensureBusy = {};
// Heute: Wochen-Wiederholung festhalten (falls ungeplant) und die Themen des Tages einmal füllen
function ensureToday() {
  if (dbState !== 'ok') return;
  const t = today();
  const W = mondayOf(t);
  const pz = pauseAt(t);
  if (pz.frei) return;
  const wk = D.wochen[W] || {};
  // Ungeplante Woche: Wiederholungszeit jeden Morgen für die restlichen Tage neu nach Fälligkeit (vergangene Tage bleiben)
  const auto = !wk.wdhVerteilung || (wk.wdhAuto && !wk.status && wk.wdhAutoAm !== t);
  if (auto && !ensureBusy['w' + W + t]) {
    ensureBusy['w' + W + t] = true;
    const need = wdhNeed(W);
    const fresh = splitWdh(W, need.sugg, t, need.list);
    const old = isObj(wk.wdhVerteilung) ? wk.wdhVerteilung : {};
    const split = {};
    weekDates(W).forEach((d) => { split[d] = d < t ? num(old[d], 0) : num(fresh[d], 0); });
    const sum = Object.keys(split).reduce((a, d) => a + split[d], 0);
    patch('wochen', W, { wdhMin: sum, wdhVerteilung: split, wdhAuto: true, wdhAutoAm: t });
  }
  if (pz.wdh) return;
  const min = wdhMinAt(t);
  const w = tag(t).wdh || {};
  const hasBew = isObj(w.bew) && Object.keys(w.bew).some((k) => w.bew[k] && w.bew[k].r);
  if (Array.isArray(w.liste) && (num(w.min, -1) === min || hasBew)) return;
  if (!Array.isArray(w.liste) && min <= 0) return;
  const key = 'd' + t + ':' + min;
  if (ensureBusy[key]) return;
  ensureBusy[key] = true;
  patch('tage', t, { wdh: { min: min, liste: fillWdh(t, min) } });
}

/* ---------- Vergangene Tage: Kulanzfenster bis 23:59 des Folgetags, danach nur noch nach unten korrigieren ---------- */
const curDay = () => S.day || today();
const isOpenDay = (date) => date >= addDays(today(), -1);
// Hinzufügen (Haken setzen, Einheit nachtragen, Zeit erhöhen, bewerten) nur im Fenster oder im Korrekturmodus
function guardAdd(date) {
  if (isOpenDay(date) || (S.korr && S.korr[date])) return true;
  toast('Dieser Tag ist abgeschlossen. Mit „Fehler korrigieren“ kannst du nachtragen.', false);
  return false;
}
const markNach = (date) => !isOpenDay(date); // außerhalb des Fensters heißt der Eintrag „nachgetragen“
const nachTag = (o) => (o && o.nachgetragen ? '<span class="tag-bsp">nachgetragen</span>' : '');

/* ---------- Abhaken ---------- */
let popId = null;
function pop(id) { popId = id; setTimeout(() => { if (popId === id) { popId = null; scheduleRender(); } }, 400); }
function ensureThemaSr(themaId, date) {
  const t = thema(themaId);
  if (t && !validSr(t.sr)) { patch('themen', themaId, { sr: srNeu(date) }); return true; }
  return false;
}
// In einer Woche mit fester Verteilung: Minuten für eine neu fällige Einheit am Fälligkeitstag dazulegen (Rückgabe für das Rückgängigmachen)
function wdhZeitDazu(faellig, min) {
  const W = mondayOf(faellig);
  const wk = D.wochen[W] || {};
  if (!isObj(wk.wdhVerteilung) || (wk.wdhAuto && !wk.status)) return null; // ungeplante Wochen rechnen jeden Morgen neu
  const day = weekDates(W).find((d) => d >= faellig && d >= today() && !pauseAt(d).frei && !pauseAt(d).wdh);
  if (!day) return null;
  const m = min || minFor(1);
  patch('wochen', W, { wdhVerteilung: { [day]: num(wk.wdhVerteilung[day], 0) + m }, wdhMin: num(wk.wdhMin, 0) + m });
  const st = wdhState(day);
  if (st.liste && !st.rated) patch('tage', day, { wdh: { liste: null, min: null } }); // am Tag neu füllen
  return { tag: day, min: m };
}
function wdhZeitWeg(z) {
  if (!z || !isDate(z.tag)) return;
  const W = mondayOf(z.tag); const wk = D.wochen[W] || {};
  if (!isObj(wk.wdhVerteilung)) return;
  patch('wochen', W, { wdhVerteilung: { [z.tag]: Math.max(0, num(wk.wdhVerteilung[z.tag], 0) - num(z.min, 0)) }, wdhMin: Math.max(0, num(wk.wdhMin, 0) - num(z.min, 0)) });
}
function setBlockDone(id, done) {
  const b = D.bloecke[id];
  if (!b) return;
  if (timerRef() === 'b:' + id) stopTimer();
  const date = b.tag || today();
  if (done) {
    const part = { status: 'erledigt', erledigtAm: date, tag: date };
    if (markNach(date)) part.nachgetragen = true;
    if (b.wdhVon) { part.wiederholen = false; part.thema = b.thema || b.wdhVon; }
    else {
      const w = typeof b.wiederholen === 'boolean' ? b.wiederholen : cfg().wdhStandard;
      part.wiederholen = w;
      let neu = false;
      if (w) { if (b.thema) neu = ensureThemaSr(b.thema, date); else if (!validSr(b.sr)) { part.sr = srNeu(date); neu = true; } }
      if (neu) {
        const f1 = addDays(date, abstand(1));
        part.wdhZeit = wdhZeitDazu(f1);
        // merken, dass dieses Neue nicht in der Planung steckt: auch seine Folgewiederholungen in dieser Woche bekommen Zeit
        if (part.wdhZeit) { if (b.thema) patch('themen', b.thema, { plusWoche: mondayOf(f1) }); else part.plusWoche = mondayOf(f1); }
      }
    }
    patch('bloecke', id, part);
    pop('b' + id);
    syncRest(id, true);
  } else {
    const part = { status: 'offen', erledigtAm: null, restAus: null, wdhZeit: null };
    if (b.wdhZeit) wdhZeitWeg(b.wdhZeit);
    if (!b.thema && b.sr && !b.sr.letzte) part.sr = null;
    if (b.wdhVon && isObj(b.bewertung)) { unrateBlock(b); part.bewertung = null; }
    patch('bloecke', id, part);

}
// Teilweise erledigt: Ist an einem abgehakten Block mit Stundenangabe weniger Zeit erfasst als geplant,

function restOf(id) {
  return Object.keys(D.bloecke).find((k) => D.bloecke[k].restVon === id && D.bloecke[k].status === 'offen') || null;
}
function syncRest(id, announce) {
  const b = D.bloecke[id];

  const rid = restOf(id);
  const std = typeof b.std === 'number' ? b.std : 0;
  const z = num(b.zeit, 0);

  const want = b.status === 'erledigt' && !b.restAus && std > 0 && z > 0 && std - z / 60 >= 0.5;
  if (!want) { if (rid && !num(D.bloecke[rid].zeit, 0)) del('bloecke', rid); return; }
  if (rid) { if (num(D.bloecke[rid].std, 0) !== rest) patch('bloecke', rid, { std: rest }); return; }
  const nid = uid('b');
  put('bloecke', nid, { titel: b.titel, woche: b.woche || mondayOf(b.tag || today()), tag: null, gebiet: b.gebiet || null, vorhaben: b.vorhaben || null, std: rest, quelle: b.quelle || 'liste', zurueckgelegt: true, restVon: id, wdhVon: b.wdhVon || null, thema: b.wdhVon ? (b.thema || b.wdhVon) : null, status: 'offen', reihe: 0, erstellt: nowMs() });
  if (announce) {
    clearTimeout(toastTimer);
    toastState = { text: 'Rest ' + fmtH(rest * 60) + ' bleibt diese Woche offen', snap: { ['bloecke/' + nid]: null, ['bloecke/' + id]: Object.assign({}, D.bloecke[id], { restAus: true }) } };

// Pro Thema und Tag zählt eine Bewertung: Ausgangspunkt ist immer der Stand vor der ersten Bewertung des Tages
function rateRef(date, ref, r) {

  const e = ((tag(date).wdh || {}).bew || {})[ref];
  const vorher = e && e.r ? (e.vorher || null) : clone(it.sr || null);
  if (!r) {
    if (e && e.r) writeSr(ref, vorher);
    if (e && e.plus) wdhZeitWeg(e.plus);

}

/* ---------- Nur für heute (mit Rückgängig) ---------- */

function stopTimer() {

  const add = Math.min(raw, 12 * 60); // ein vergessener Timer zählt höchstens 12 h
  if (raw > add) setTimeout(() => toast('Der Timer lief über 12 h. Eingetragen sind 12 h, ändern kannst du die Zeit an der Zeile.', false), 0);

/* ---------- Einmalige Termine aus der Woche ---------- */

function addTerminWeekly(date, titel, von, bis, ganztags, endet) {
  put('termine', uid('t'), { titel: titel, wochentage: [wdOf(date)], von: ganztags ? '' : von || '', bis: ganztags ? '' : bis || '', ganztags: !!ganztags, ab: date, endet: isDate(endet) ? endet : null, zustand: 'aktiv', erstellt: nowMs() });

// In einer übergebenen Woche: passt ein Block nach einem neuen Termin nicht mehr, wandert er auf einen Tag mit Platz, sonst nach „noch offen“
function reflowDay(date) {
  const W = mondayOf(date);
  const wk = D.wochen[W] || {};
  if (wk.status !== 'uebergeben' || date < today()) return;
  const split = weekWdh(W).split;
  const load = (d) => blocksAt(d).filter((b) => b.status === 'offen' && b.quelle === 'claude').reduce((a, b) => a + num(b.std, 1), 0);
  const room = (d) => freeH(d) - num(split[d], 0) / 60 - load(d);
  let guard = 0;
  while (room(date) < -0.01 && guard++ < 5) {
    const bl = blocksAt(date).filter((b) => b.status === 'offen' && b.quelle === 'claude').pop();
    if (!bl) break;
    const cap = capacity(W, split, today());
    const target = Object.keys(cap).sort().find((d) => d !== date && room(d) >= num(bl.std, 1) && blocksAt(d).length < cfg().bloeckeProTag);
    patch('bloecke', bl.id, target ? { tag: target } : { tag: null });
    toast(target ? '„' + shortName(bl.titel) + '“ liegt jetzt am ' + WDL[wdOf(target)] : '„' + shortName(bl.titel) + '“ liegt jetzt in „Noch offen“', false);
  }
}

    if (b.woche !== W || b.quelle === 'klausur') return;
    if (b.status === 'erledigt') { done.push(b.titel); zeit += num(b.zeit, 0); }
    else if (b.status === 'offen') open.push(b.titel);
  });
  let wdhTage = 0; let wdhDone = 0; let rDone = 0; let rAll = 0;
  weekDates(W).forEach((d) => {
    if (d > today()) return;
    zeit += wdhState(d).zeit;
    if (wdhPlanned(d)) { wdhTage++; if (wdhState(d).done) wdhDone++; }
    routinenAt(d).forEach((r) => { rAll++; if (((tag(d).routinen || {})[r.id] || {}).erledigt) rDone++; });
  });
  return { done: done, open: open, zeit: zeit, wdhTage: wdhTage, wdhDone: wdhDone, rDone: rDone, rAll: rAll };
}

}

const ZS_N = 12; // Wochen pro Ansicht
function zsDaten(von, bis) {
  const out = {}; // gebiet -> W -> { neu: [], wdh: [] }
  const add = (g, W, art, txt) => { g = g || ''; out[g] = out[g] || {}; out[g][W] = out[g][W] || { neu: [], wdh: [], durch: [] }; if (out[g][W][art].indexOf(txt) < 0) out[g][W][art].push(txt); };
  Object.keys(D.bloecke).forEach((id) => {
    const b = D.bloecke[id];
    if (b.status !== 'erledigt' || b.wdhVon || !isDate(b.erledigtAm) || b.erledigtAm < von || b.erledigtAm > bis || b.titel === 'Freie Lernzeit') return;
    add(b.gebiet || (b.thema ? topOf(b.thema) : null), mondayOf(b.erledigtAm), 'neu', b.titel);
  });
  Object.keys(D.tage).forEach((d) => {
    if (d < von || d > bis) return;
    const bew = ((D.tage[d].wdh || {}).bew) || {};
    Object.keys(bew).forEach((ref) => {
      if (!bew[ref] || !bew[ref].r) return;
      const it = srByRef(ref);
      if (it) add(it.gebiet, mondayOf(d), 'wdh', it.titel);
    });
  });
  // Durchgearbeitet, mit Durchgang, sobald es mehr als einen gibt
  Object.keys(D.themen).forEach((id) => {
    const t = D.themen[id];
    const ds = (Array.isArray(t.frueher) ? t.frueher : []).concat([t.durchAm]);
    ds.forEach((d, i) => { if (isDate(d) && d >= von && d <= bis) add(topOf(id), mondayOf(d), 'durch', t.name + (ds.length > 1 ? ' (' + (i + 1) + '. Durchgang)' : '')); });
  });
  return out;
}

/* ---------- Gliederung einfügen: eingerückte oder nummerierte Zeilen werden zu Themen ---------- */
const GL_MARKER = [/^[A-Z]\.\s+/, /^[IVXLC]+\.\s+/, /^\d+\.\s+/, /^[a-z]\)\s+/, /^[a-z]{2}\)\s+/, /^\([a-z]+\)\s+/, /^\([a-z]{2}\)\s+/];
function gliederungParse(text) {
  const raw = String(text || '').replace(/\r/g, '').split('\n').map((l) => l.replace(/\t/g, '    ')).filter((l) => l.trim());
  const einrueck = raw.some((l) => /^\s+/.test(l));
  const breiten = Array.from(new Set(raw.map((l) => l.match(/^\s*/)[0].length))).sort((a, b) => a - b);
  const klassen = [];
  const out = [];
  raw.forEach((l) => {
    let name = l.trim().replace(/^[-–•*·]\s+/, '');
    let level = 0;
    // I. (römisch) vor A. prüfen, damit „I.“ nicht als Großbuchstabe gilt; „V.“ und „C.“ bleiben mehrdeutig, römisch gewinnt
    const k = [1, 0, 2, 3, 4, 5, 6].find((i) => GL_MARKER[i].test(name));
    if (k != null) name = name.replace(GL_MARKER[k], '');
    if (einrueck) level = breiten.indexOf(l.match(/^\s*/)[0].length);
    else if (k != null) { if (klassen.indexOf(k) < 0) klassen.push(k); level = klassen.indexOf(k); }
    name = name.trim();
    if (name) out.push({ name: name.slice(0, 200), level: level });
  });
  // Sprünge glätten: höchstens eine Ebene tiefer als die Zeile davor
  let prev = -1;
  out.forEach((x) => { if (x.level > prev + 1) x.level = prev + 1; prev = x.level; });
  return out;
}

function gliederungPlan(text, parent) {
  const zeilen = gliederungParse(text);
  const basis = parent ? thDepth(parent) + 1 : 0;
  const stack = []; const plan = []; let gekappt = 0;
  zeilen.forEach((z) => {
    let lv = z.level;
    if (basis + lv > MAX_TIEFE - 1) { lv = MAX_TIEFE - 1 - basis; gekappt++; }
    stack.length = lv;
    const el = lv ? stack[lv - 1] : { id: parent || null, neu: false };
    const gleich = (n) => n.toLowerCase() === z.name.toLowerCase();
    let knoten = null;
    const vorhanden = !el.neu ? thKids(el.id).find((k) => gleich(D.themen[k].name)) : null;
    if (vorhanden) { knoten = { id: vorhanden, neu: false }; plan.push({ id: vorhanden, name: z.name, level: lv, vorhanden: true }); }
    else {
      const dup = plan.find((x) => !x.vorhanden && x.eltern === el.id && gleich(x.name));
      if (dup) knoten = { id: dup.id, neu: true };
      else { knoten = { id: uid('th'), neu: true }; plan.push({ id: knoten.id, name: z.name, eltern: el.id, level: lv, vorhanden: false }); }
    }
    stack[lv] = knoten;
  });
  return { plan: plan, gekappt: gekappt, basis: basis };
}

function gliederungAnlegen(text, parent) {
  const pv = gliederungPlan(text, parent);
  const neu = pv.plan.filter((x) => !x.vorhanden);
  if (!neu.length) return 0;
  const rf = {}; // Reihenfolge je Eltern-Thema fortsetzen
  undoable(anz(neu.length, 'Thema', 'Themen') + ' angelegt', () => neu.forEach((x) => {
    const k = x.eltern || '';
    if (rf[k] == null) { const sib = thKids(x.eltern || null); rf[k] = sib.length ? Math.max(...sib.map((s) => num(D.themen[s].reihenfolge, 0))) : 0; }
    rf[k] += 1;
    put('themen', x.id, { name: x.name, eltern: x.eltern || null, zustand: 'aktiv', reihenfolge: rf[k], erstellt: nowMs() });
  }));
  return neu.length;
}
function thCreate(name, parent) {

  undoable('Thema „' + name + '“ angelegt', () => put('themen', id, { name: name, eltern: parent || null, zustand: 'aktiv', reihenfolge: sib.length ? Math.max(...sib.map((s) => num(D.themen[s].reihenfolge, 0))) + 1 : 1, erstellt: nowMs() }));
  return id;
}
// Zuordnen: das Thema übernimmt die Wiederholung; kommt etwas Neues hinzu, wird es nicht später fällig als die Einheit
function thAssign(bid, tid) {
  const b = D.bloecke[bid]; const t = thema(tid);
  if (!b || !t) return;
  undoable('„' + shortName(b.titel) + '“ liegt jetzt in ' + t.name, () => {
    if (!validSr(t.sr)) patch('themen', tid, { sr: validSr(b.sr) ? b.sr : srNeu(b.erledigtAm || today()) });
    else if (validSr(b.sr) && b.sr.faellig < t.sr.faellig) patch('themen', tid, { sr: Object.assign({}, t.sr, { faellig: b.sr.faellig }) });
    patch('bloecke', bid, { thema: tid, gebiet: topOf(tid), sr: null });
  });
}
function thUnassign(bid) {
  const b = D.bloecke[bid];

  undoable('Zurück im Eingang', () => patch('bloecke', bid, { thema: null, sr: b.wiederholen !== false ? srNeu(b.erledigtAm || today()) : null }));
}
function thZustand(id, z) {
  const t = thema(id);
  if (!t || (t.zustand || 'aktiv') === z) return;
  undoable(t.name + ': ' + z, () => {
    // Wieder aktiviert nach dem Abschluss: Wiederholung beginnt mit kurzem Abstand neu
    const restart = z === 'aktiv' && t.zustand === 'abgeschlossen';
    if (restart) thDesc(id).forEach((x) => { if (validSr(thema(x).sr)) patch('themen', x, { sr: srNeu(today()) }); });
    const part = { zustand: z, abgeschlossenAm: z === 'abgeschlossen' ? today() : null };
    if (restart && validSr(t.sr)) part.sr = srNeu(today());
    patch('themen', id, part);
  });
}
function thWdhToggle(id) {

}
const fitsUnder = (id, parent) => (parent ? thDepth(parent) + 1 : 0) + thSubDepth(id) <= MAX_TIEFE - 1;
function thMove(id, to) {
  const t = thema(id);
  if (!t || !to) return 'Bitte wählen, wohin.';
  const parent = to === '_top' ? null : to;
  if (parent && (parent === id || thDesc(id).indexOf(parent) >= 0)) return 'Ein Thema kann nicht unter sich selbst liegen.';
  if (!fitsUnder(id, parent)) return 'Dort wären es mehr als vier Ebenen.';
  if ((thParent(id) || null) === parent) return '';
  const sib = thKids(parent);
  undoable('Verschoben', () => {
    patch('themen', id, { eltern: parent, reihenfolge: sib.length ? Math.max(...sib.map((s) => num(D.themen[s].reihenfolge, 0))) + 1 : 1 });
    const g = parent ? topOf(parent) : id;
    [id].concat(thDesc(id)).forEach((x) => Object.keys(D.bloecke).forEach((k) => { if (D.bloecke[k].thema === x && D.bloecke[k].gebiet !== g) patch('bloecke', k, { gebiet: g }); }));
  });
  return '';
}
// Zusammenlegen: Einheiten, Unterthemen und Verweise wandern ins Ziel, das frühere Fälligkeitsdatum gilt
function thMerge(id, target) {
  const t = thema(id); const z = thema(target);
  if (!t || !z) return 'Bitte ein Zielthema wählen.';
  if (target === id || thDesc(id).indexOf(target) >= 0) return 'Ein Thema kann nicht in sein eigenes Unterthema.';
  const kids = thKids(id);
  if (kids.some((k) => !fitsUnder(k, target))) return 'Die Unterthemen hätten dort mehr als vier Ebenen.';
  const g = topOf(target);
  undoable('„' + t.name + '“ in „' + z.name + '“ zusammengelegt', () => {
    Object.keys(D.bloecke).forEach((k) => {
      const b = D.bloecke[k]; const part = {};
      if (b.thema === id) { part.thema = target; part.gebiet = g; }
      if (b.wdhVon === id) part.wdhVon = target;
      if (Object.keys(part).length) patch('bloecke', k, part);
    });
    Object.keys(D.vorhaben).forEach((k) => { if (D.vorhaben[k].wdhVon === id) patch('vorhaben', k, { wdhVon: target }); });
    const sub = thDesc(id);
    kids.forEach((k) => patch('themen', k, { eltern: target }));
    sub.forEach((x) => Object.keys(D.bloecke).forEach((k) => { if (D.bloecke[k].thema === x && D.bloecke[k].gebiet !== g) patch('bloecke', k, { gebiet: g }); }));
    if (validSr(t.sr) && (!validSr(z.sr) || t.sr.faellig < z.sr.faellig)) patch('themen', target, { sr: validSr(z.sr) ? Object.assign({}, z.sr, { faellig: t.sr.faellig }) : t.sr });
    del('themen', id);
  });
  TH.sel = target;
  return '';
}
// Löschen samt Unterthemen: eigene Lerneinheiten kommen zurück in den Eingang, Beispiel-Einträge verschwinden mit
function thDeleteTree(ids, text, vorher, genau) {
  const all = new Set();
  ids.forEach((id) => { if (thema(id)) { all.add(id); if (!genau) thDesc(id).forEach((x) => all.add(x)); } });
  if (!all.size) return;
  undoable(text, () => {
    if (vorher) vorher();
    Object.keys(D.bloecke).forEach((k) => {
      const b = D.bloecke[k];
      if (!all.has(b.thema) && !all.has(b.wdhVon)) return;
      if (b.beispiel) { del('bloecke', k); return; }
      const part = {};
      if (all.has(b.wdhVon)) { part.wdhVon = null; part.thema = null; }
      if (all.has(b.thema) && b.status === 'erledigt' && !b.wdhVon) { part.thema = null; part.sr = b.wiederholen !== false ? srNeu(b.erledigtAm || today()) : null; }
      else if (all.has(b.thema)) part.thema = null;
      patch('bloecke', k, part);
    });
    Object.keys(D.vorhaben).forEach((k) => { if (all.has(D.vorhaben[k].wdhVon)) patch('vorhaben', k, { wdhVon: null }); });
    all.forEach((id) => del('themen', id));
  });
  if (all.has(TH.sel)) TH.sel = null;
}

function thDelete(id) {
  const t = thema(id);
  if (!t) return;
  const n = thDesc(id).length;
  thDeleteTree([id], '„' + t.name + '“' + (n ? ' samt ' + (n === 1 ? 'einem Unterthema' : n + ' Unterthemen') : '') + ' gelöscht');
}
function thDeleteBsp() {
  // Eigene Themen unter einem Beispiel-Thema bleiben erhalten und rücken eine Ebene nach oben
  const bsp = new Set(Object.keys(D.themen).filter((id) => D.themen[id].beispiel));
  const keep = Object.keys(D.themen).filter((id) => !bsp.has(id) && bsp.has(thParent(id)));
  const lift = (id) => { let p = thParent(id); while (p && bsp.has(p)) p = thParent(p); return p; };
  const moves = keep.map((id) => [id, lift(id)]);
  thDeleteTree(Array.from(bsp), 'Beispiel-Themen entfernt', () => moves.forEach((m) => patch('themen', m[0], { eltern: m[1] || null })), true);
}

function exportData() {

  COLS.forEach((col) => { daten[col] = clone(D[col]); });
  if (daten.meta) delete daten.meta.timer;
  return { format: 'lernsystem', version: 1, exportiert: today(), daten: daten };
}
function downloadExport() {
  const blob = new Blob([JSON.stringify(exportData(), null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lernsystem-sicherung-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  patch('meta', 'sicherung', { am: today() });

}
function parseImport(text) {
  const j = JSON.parse(text);
  if (!j || j.format !== 'lernsystem' || !isObj(j.daten)) throw new Error('format');
  const daten = {};
  COLS.forEach((col) => {
    const src = isObj(j.daten[col]) ? j.daten[col] : {};
    daten[col] = {};
    Object.keys(src).forEach((id) => { if (cleanId(id) && isObj(src[id])) daten[col][id] = src[id]; });
  });
  return daten;
}
function applyImport(daten) {
  undoable('Daten geladen', () => {
    COLS.forEach((col) => {
      Object.keys(D[col]).forEach((id) => { if (!(id in daten[col]) && !(col === 'meta' && id === 'timer')) del(col, id); });
      Object.keys(daten[col]).forEach((id) => put(col, id, daten[col][id]));
    });
  });
}
